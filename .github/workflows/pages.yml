name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  # Los commits de datos los hace scraper-bot con GITHUB_TOKEN, y ese push
  # no dispara workflows: por eso también escuchamos el fin de los runs que
  # commitean datos. Solo se deploya si el run terminó bien.
  workflow_run:
    workflows: ["Scrape semanal", "Enriquecer logos (manual)"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Armar sitio
        run: |
          mkdir -p dist/data
          cp index.html dist/
          cp manifest.json dist/
          cp icon.svg dist/
          cp sw.js dist/
          cp data/empresas.json dist/data/
          HASH=$(git rev-parse --short HEAD)
          sed -i -E "s/const CACHE = 'dir-[^']+'/const CACHE = 'dir-$HASH'/" dist/sw.js
          grep -q "const CACHE = 'dir-$HASH'" dist/sw.js || { echo "::error::sed no aplicó CACHE en sw.js"; exit 1; }

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - uses: actions/deploy-pages@v4
        id: deployment

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="LABAC">
  <style>
    .mark-light { display: block; }
    .mark-dark { display: none; }
    @media (prefers-color-scheme: dark) {
      .mark-light { display: none; }
      .mark-dark { display: block; }
    }
  </style>
  <image class="mark-light" href="data:image/png;base64," width="160" height="160" />
  <image class="mark-dark" href="data:image/png;base64," width="160" height="160" />
</svg>

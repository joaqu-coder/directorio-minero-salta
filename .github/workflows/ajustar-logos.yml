name: Ajustar tonos de logos

# Aloja en data/logos/ los logos remotos (sin depender de los sitios de origen)
# y genera data/logos_ajuste.json para que todos se vean con la misma tonalidad.
# Solo manual: se vuelve a correr cuando cambian los logos.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ajustar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install pillow curl_cffi

      - name: Medir logos
        run: python scraper/ajustar_logos.py --alojar

      - name: Commit si hay cambios
        run: |
          git config user.name "scraper-bot"
          git config user.email "actions@github.com"
          git add data/logos data/logos_ajuste.json
          if git diff --cached --quiet; then
            echo "Sin cambios."
            exit 0
          fi
          git commit -m "feat(data): alojar logos y ajustar tonos (escala de grises uniforme)"
          git push

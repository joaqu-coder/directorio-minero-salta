<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parques Industriales</title>
<meta name="description" content="Directorio de empresas de los parques industriales de Güemes y Salta.">
<meta name="theme-color" content="#0a0c10">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0c10; --surface:#12151c; --surface2:#181c26; --border:#222837;
  --text:#e8eaf0; --muted:#8b93a7; --accent:#e8a33d;
  --guemes:#a78bfa; --salta:#4d8fe8;
  --escriturada:#50c878; --no-escriturada:#e8a33d;
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scrollbar-gutter:stable}
body{
  background:var(--bg); color:var(--text);
  font-family:'Manrope',system-ui,sans-serif; font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:'DM Mono',monospace}
a{color:var(--accent);text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

header{
  position:sticky;top:0;z-index:50;background:rgba(10,12,16,.92);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--border);
}
.nav{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{font-weight:800;font-size:17px;letter-spacing:-.02em;white-space:nowrap}
.brand small{display:block;font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
.nav-spacer{flex:1}
.icon-btn{
  width:38px;height:38px;border-radius:10px;display:grid;place-items:center;
  border:1px solid var(--border);background:var(--surface);color:var(--muted);flex:none;
}
.icon-btn:hover{color:var(--text)}
.icon-btn svg{width:18px;height:18px}

.controles{max-width:1100px;margin:0 auto;padding:14px 16px 4px}
.search-wrap{position:relative}
.search-wrap svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
#buscador{
  width:100%;padding:11px 38px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);color:var(--text);font:inherit;outline:none;
}
#buscador:focus{border-color:#3a4357}
#limpiar{position:absolute;right:6px;top:50%;transform:translateY(-50%);padding:6px 8px;color:var(--muted);display:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;padding:5px 12px;border-radius:99px;border:1px solid var(--border);
  background:var(--surface);color:var(--muted);font-size:12.5px;font-weight:600;white-space:nowrap;
}
.chip.activo{color:var(--text);border-color:var(--accent);background:rgba(232,163,61,.1)}
.chip[data-parque="Parque Güemes"].activo{border-color:var(--guemes);background:rgba(167,139,250,.12)}
.chip[data-parque="Parque Industrial Salta"].activo{border-color:var(--salta);background:rgba(77,143,232,.12)}
#contador{max-width:1100px;margin:0 auto;padding:2px 16px;font-size:12px;color:var(--muted)}

#lista{
  max-width:1100px;margin:0 auto;padding:10px 16px 60px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px;
}
@media(min-width:700px){#lista{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}}
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:12px;display:flex;flex-direction:column;gap:8px;cursor:pointer;
  transition:border-color .15s, transform .15s;
}
.card:hover{border-color:#3a4357;transform:translateY(-2px)}
.logo-ini{
  width:100%;aspect-ratio:1;border-radius:10px;display:grid;place-items:center;
  font-weight:800;font-size:34px;color:#fff;letter-spacing:.02em;
}
.card h3{font-size:13.5px;font-weight:700;line-height:1.3;letter-spacing:-.01em}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto}
.badge{
  font-family:'DM Mono',monospace;font-size:9.5px;padding:2px 7px;border-radius:5px;
  letter-spacing:.04em;border:1px solid var(--border);color:var(--muted);
}
.badge.parque{font-weight:500;color:#fff;border:none}
.badge.parque.guemes{background:var(--guemes)}
.badge.parque.salta{background:var(--salta)}
.badge.estado{font-weight:600;border:none;color:#000}
.badge.estado.escriturada{background:var(--escriturada)}
.badge.estado.no-escriturada{background:var(--no-escriturada)}
.badge.estado.desconocido{background:transparent;color:var(--muted);border:1px solid var(--border)}
#vacio{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 0;display:none}

dialog{
  border:none;background:transparent;padding:0;max-width:560px;width:calc(100% - 24px);
  margin:auto;outline:none;
}
dialog :focus{outline:none}
dialog :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
dialog::backdrop{background:rgba(0,0,0,.65);backdrop-filter:blur(3px)}
.ficha{
  background:var(--surface);border:1px solid var(--border);border-radius:18px;
  max-height:88vh;overflow-y:auto;padding:22px;position:relative;
}
.ficha-top{display:flex;gap:16px;align-items:flex-start}
.ficha .logo-ini{width:72px;flex:none;aspect-ratio:1;font-size:26px}
.ficha h2{font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.25;padding-right:30px;color:var(--text)}
.ficha .subt{color:var(--muted);font-size:13px;margin-top:4px}
.cerrar{position:absolute;top:12px;right:12px;color:var(--muted);padding:8px;font-size:18px;line-height:1}
.ficha .badges{margin:14px 0 4px}
.datos-lista{margin-top:14px;display:flex;flex-direction:column;gap:2px}
.dato{
  display:flex;gap:12px;align-items:baseline;padding:9px 10px;border-radius:9px;
  font-size:13.5px;
}
.dato:hover{background:var(--surface2)}
.dato .k{font-family:'DM Mono',monospace;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;width:72px;flex:none}
.dato .v{word-break:break-word;color:var(--text)}
.dato .v a{color:var(--text);border-bottom:1px solid #3a4357}
.sin-info{color:var(--muted);font-style:italic;opacity:.7}
.cruzado{font-size:12.5px;color:var(--muted);margin-top:12px;padding:9px 10px;border:1px solid var(--border);border-radius:9px}
.cruzado a{color:var(--accent);font-weight:600}
.ficha-acciones{display:flex;gap:8px;margin-top:18px}
.btn{
  flex:1;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);
  font-weight:700;font-size:13px;text-align:center;
}
.btn:hover{border-color:#3a4357}
.btn.primario{background:var(--accent);color:#000;border-color:var(--accent)}

.lotes{margin-top:18px;border-top:1px solid var(--border);padding-top:12px}
.lotes h4{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px;font-family:'DM Mono',monospace}
.lote-item{padding:10px;border-radius:9px;border:1px solid var(--border);margin-bottom:6px;font-size:12.5px}
.lote-item .fila1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lote-item .num{font-family:'DM Mono',monospace;color:var(--text)}
.lote-item .sup{color:var(--muted);font-family:'DM Mono',monospace;font-size:11.5px}
.lote-item .obs{color:var(--muted);margin-top:4px;font-size:11.5px}

footer{
  max-width:1100px;margin:0 auto;padding:18px 16px 40px;color:var(--muted);
  font-size:11.5px;font-family:'DM Mono',monospace;border-top:1px solid var(--border);
}
</style>
</head>
<body>

<header>
  <div class="nav">
    <div class="brand">Parques Industriales<small>Güemes · Salta</small></div>
    <div class="nav-spacer"></div>
    <a class="icon-btn" href="../index.html" title="Ir al directorio de cámaras" aria-label="Cámaras">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
    </a>
  </div>
</header>

<div class="controles">
  <div class="search-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="buscador" type="search" placeholder="Buscar empresa, rubro, matrícula…" autocomplete="off">
    <button id="limpiar" aria-label="Limpiar">✕</button>
  </div>
  <div class="chips" id="chipsParques"></div>
</div>

<div id="contador"></div>
<main id="lista"><div id="vacio">Sin resultados para esa búsqueda.</div></main>

<dialog id="modalFicha"><div class="ficha" id="fichaContenido"></div></dialog>

<footer>
  <span id="metaGenerado"></span> · datos catastrales de EGPAIS (Ente General de Parques y Áreas Industriales de Salta)
</footer>

<script>
'use strict';
const $ = s => document.querySelector(s);
let DB = { parques: [], empresas: [] };
let CRUCE = {};
let filtro = { q: '', parque: null };

const norm = s => (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const esc = s => (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iniciales = n => n.split(/\s+/).filter(w => /\w/.test(w)).slice(0, 2).map(w => w[0]).join('').toUpperCase();
const hue = n => { let h = 0; for (const c of n) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const claseParque = p => p === 'Parque Güemes' ? 'guemes' : 'salta';
const claseEstado = estado => estado === 'escriturada' ? 'escriturada' : (estado === 'no escriturada' ? 'no-escriturada' : 'desconocido');
const labelEstado = estado => estado === 'escriturada' ? 'Escriturada' : (estado === 'no escriturada' ? 'No escriturada' : 'Sin dato');

function logoHtml(e) {
  return `<div class="logo-ini" style="background:hsl(${hue(e.nombre)},35%,28%)">${esc(iniciales(e.nombre))}</div>`;
}

function badgesHtml(e) {
  const lotes = e.lotes.filter(l => l.numero_matricula || l.titularidad);
  return `<div class="badges">
    ${e.parque ? `<span class="badge parque ${claseParque(e.parque)}">${esc(e.parque)}</span>` : ''}
    ${e.rubro ? `<span class="badge">${esc(e.rubro)}</span>` : ''}
    ${lotes.length ? `<span class="badge">${lotes.length} lote${lotes.length === 1 ? '' : 's'}</span>` : ''}
  </div>`;
}

function filtrar() {
  const q = norm(filtro.q);
  return DB.empresas.filter(e => {
    if (filtro.parque && e.parque !== filtro.parque) return false;
    if (!q) return true;
    return e._busqueda.includes(q);
  });
}

function renderLista() {
  const items = filtrar();
  const lista = $('#lista');
  lista.querySelectorAll('.card').forEach(c => c.remove());
  $('#vacio').style.display = items.length ? 'none' : 'block';
  $('#contador').textContent = `${items.length} empresa${items.length === 1 ? '' : 's'}`;
  const frag = document.createDocumentFragment();
  for (const e of items) {
    const card = document.createElement('article');
    card.className = 'card';
    card.innerHTML = `
      ${logoHtml(e)}
      <h3>${esc(e.nombre)}</h3>
      <p style="font-size:12px;color:var(--muted);line-height:1.4;margin:0">
        ${esc(e.direccion || e.situacion || 'Ver más información')}
      </p>
      ${badgesHtml(e)}`;
    card.addEventListener('click', () => abrirFicha(e));
    frag.appendChild(card);
  }
  lista.appendChild(frag);
}

function renderChips() {
  $('#chipsParques').innerHTML = DB.parques.map(p =>
    `<button class="chip" data-parque="${esc(p.nombre)}">${esc(p.nombre)}</button>`).join('');
  $('#chipsParques').addEventListener('click', ev => {
    const b = ev.target.closest('.chip'); if (!b) return;
    filtro.parque = filtro.parque === b.dataset.parque ? null : b.dataset.parque;
    actualizarChips(); renderLista();
  });
}
function actualizarChips() {
  document.querySelectorAll('#chipsParques .chip').forEach(c =>
    c.classList.toggle('activo', c.dataset.parque === filtro.parque));
}

const SIN_INFO = '<span class="sin-info">Sin información</span>';
function dato(k, vHtml, siempre = false) {
  if (!vHtml && !siempre) return '';
  return `<div class="dato"><span class="k">${k}</span><span class="v">${vHtml || SIN_INFO}</span></div>`;
}

function lotesHtml(e) {
  const lotes = e.lotes.filter(l => l.numero_matricula || l.titularidad || l.numero_lote);
  if (!lotes.length) {
    return `<div class="lotes"><h4>Lotes</h4><p class="sin-info">Sin datos catastrales cargados todavía.</p></div>`;
  }
  return `<div class="lotes"><h4>Lotes (${lotes.length})</h4>
    ${lotes.map(l => `
      <div class="lote-item">
        <div class="fila1">
          <span class="num">${l.numero_lote ? `Lote ${esc(l.numero_lote)}` : 'Lote s/d'}${l.numero_matricula ? ` · Mat. ${esc(l.numero_matricula)}` : ''}</span>
          <span class="badge estado ${claseEstado(l.estado)}">${labelEstado(l.estado)}</span>
        </div>
        ${l.superficie_m2 ? `<div class="sup">${esc(l.superficie_m2)} m²</div>` : ''}
        ${l.titularidad ? `<div class="obs">Titularidad: ${esc(l.titularidad)}</div>` : ''}
        ${l.observacion ? `<div class="obs">${esc(l.observacion)}</div>` : ''}
      </div>`).join('')}
  </div>`;
}

function cruzadoHtml(e) {
  const cruce = e.cuit ? CRUCE[e.cuit] : null;
  if (!cruce || !cruce.en_camaras || !cruce.camaras) return '';
  return `<div class="cruzado">También en cámaras: <a href="../index.html?empresa=${esc(cruce.camaras.slug)}">${esc(cruce.camaras.nombre)} →</a></div>`;
}

function abrirFicha(e, pushUrl = true) {
  const cont = $('#fichaContenido');
  cont.innerHTML = `
    <button class="cerrar" aria-label="Cerrar">✕</button>
    <div class="ficha-top">
      ${logoHtml(e)}
      <div>
        <h2>${esc(e.nombre)}</h2>
        ${e.rubro ? `<div class="subt">${esc(e.rubro)}</div>` : ''}
      </div>
    </div>
    ${badgesHtml(e)}
    <div class="datos-lista">
      ${dato('Dirección', e.direccion ? esc(e.direccion) : null, true)}
      ${dato('CUIT', e.cuit ? `<span class="mono">${esc(e.cuit)}</span>` : null)}
      ${dato('Situación', e.situacion ? esc(e.situacion) : null)}
      ${dato('Contacto', e.contacto ? esc(e.contacto) : null)}
      ${dato('Teléfono', [e.telefono_1, e.telefono_2].filter(Boolean).map(t => `<a href="tel:${esc(t.replace(/[^\d+]/g, ''))}" class="mono">${esc(t)}</a>`).join(', ') || null)}
      ${dato('Email', [e.email_1, e.email_2].filter(Boolean).map(m => `<a href="mailto:${esc(m)}" class="mono">${esc(m)}</a>`).join(', ') || null)}
      ${dato('Web', e.web ? `<a href="${esc(e.web)}" target="_blank" rel="noopener" class="mono">${esc(e.web.replace(/^https?:\/\//, '').replace(/\/$/, ''))}</a>` : null)}
      ${dato('Instagram', e.instagram ? `<a href="${esc(e.instagram)}" target="_blank" rel="noopener" class="mono">${esc(e.instagram.replace(/\/$/, '').split('/').pop())}</a>` : null)}
      ${dato('Facebook', e.facebook ? `<a href="${esc(e.facebook)}" target="_blank" rel="noopener" class="mono">${esc(e.facebook.replace(/\/$/, '').split('/').pop())}</a>` : null)}
    </div>
    ${cruzadoHtml(e)}
    ${lotesHtml(e)}
  `;
  cont.querySelector('.cerrar').onclick = () => $('#modalFicha').close();
  const modal = $('#modalFicha');
  if (!modal.open) modal.showModal();
  if (pushUrl) history.replaceState(null, '', `?empresa=${e.slug}`);
}

$('#modalFicha').addEventListener('close', () => history.replaceState(null, '', location.pathname));
document.querySelectorAll('dialog').forEach(d =>
  d.addEventListener('click', ev => { if (ev.target === d) d.close(); }));

let debounce;
$('#buscador').addEventListener('input', ev => {
  clearTimeout(debounce);
  $('#limpiar').style.display = ev.target.value ? 'block' : 'none';
  debounce = setTimeout(() => { filtro.q = ev.target.value; renderLista(); }, 120);
});
$('#limpiar').onclick = () => {
  $('#buscador').value = ''; filtro.q = ''; $('#limpiar').style.display = 'none'; renderLista();
};

(async function init() {
  try {
    const [resParques, resCruce] = await Promise.all([
      fetch('data/parques.json'),
      fetch('data/cruce.json').catch(() => null),
    ]);
    DB = await resParques.json();
    CRUCE = resCruce && resCruce.ok ? await resCruce.json() : {};
  } catch (e) {
    $('#contador').textContent = 'Error cargando datos.';
    return;
  }
  for (const e of DB.empresas) {
    e._busqueda = norm([
      e.nombre, e.rubro, e.situacion, e.contacto, e.direccion,
      ...e.lotes.map(l => l.numero_matricula), ...e.lotes.map(l => l.titularidad),
    ].filter(Boolean).join(' '));
  }
  $('#metaGenerado').textContent = DB.generado ? `actualizado ${DB.generado.slice(0, 10)}` : '';
  renderChips();
  renderLista();
  const slug = new URLSearchParams(location.search).get('empresa');
  if (slug) {
    const e = DB.empresas.find(x => x.slug === slug);
    if (e) abrirFicha(e, false);
  }
})();
</script>
</body>
</html>

name: Ajustar tonos de logos

# Mide cada logo (locales y remotos) y genera data/logos_ajuste.json para que
# todos se vean con la misma tonalidad en la app. Solo manual: se vuelve a
# correr cuando cambian los logos.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ajustar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Pillow
        run: pip install pillow

      - name: Medir logos
        run: python scraper/ajustar_logos.py --descargar

      - name: Commit si hay cambios
        run: |
          git config user.name "scraper-bot"
          git config user.email "actions@github.com"
          git add data/logos_ajuste.json
          if git diff --cached --quiet; then
            echo "Sin cambios."
            exit 0
          fi
          git commit -m "feat(data): ajuste de tonos de logos (escala de grises uniforme)"
          git push
